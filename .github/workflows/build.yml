name: Build MCP Manager

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libatspi2.0-0
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name mcp_manager mcp_manager.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp_manager-${{ matrix.os }}
          path: dist/mcp_manager*
