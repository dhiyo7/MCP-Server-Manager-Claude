name: Build & Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub untuk release (contoh: v1.0.0)'
        required: true
        default: v1.0.0
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name mcp_manager mcp_manager.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp_manager-${{ matrix.os }}
          path: dist/mcp_manager*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          for os in ubuntu-latest windows-latest macos-latest; do
            src="artifacts/mcp_manager-${os}/mcp_manager"
            case $os in
              ubuntu-latest) ext="" ;;
              windows-latest) ext=".exe" ;;
              macos-latest) ext="" ;;
            esac
            if [ -f "${src}${ext}" ]; then
              cp "${src}${ext}" "release/mcp_manager-${os}${ext}"
            fi
          done
          ls -la release/
      - name: Create Release
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" release/* \
            --title "Release $TAG" \
            --notes "MCP Server Manager - Cross-platform desktop tool for managing claude_desktop_config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}